<!DOCTYPE html>

<head>

<link rel="stylesheet" href="css/style.css">
<meta property="og:title" content="Family Boxes & Cake Dubai — Mr Nutella Koléa">

<meta property="og:site_name" content="Mr Nutella Koléa">

<body data-page="boxes.html" data-title="Family Boxes — Mr Nutella" data-title-ar="البوكسات — Mr Nutella">

<header class="navbar" id="navbar"></header>

<div class="menu-hero">
  <div class="container">
    <h1 data-i18n="boxes_h1"></h1>
    <p data-i18n="boxes_sub"></p>
  </div>
  <div class="drip" data-color="#FFF6E9"></div>
</div>

<section style="padding-top:40px">
  <div class="container">
    <div class="box-grid">

      <article class="box-card reveal">
        <div class="box-head gold">
          <h3 data-i18n="box_friends"></h3>
          <span class="ppl">👥 <span data-i18n="box_friends_ppl"></span></span>
        </div>
        <div class="box-body">
          <ul>
            <li data-i18n="box_c_fruits"></li>
            <li data-i18n="box_c_mini"></li>
            <li data-i18n="box_c_gaufres"></li>
            <li data-i18n="box_c_crepes"></li>
            <li data-i18n="box_sauces"></li>
          </ul>
          <div class="box-prices">
            <div class="bp-chip n"><b>1800 <span class="da-lbl">DA</span></b><small>Nutella</small></div>
            <div class="bp-chip m"><b>1400 <span class="da-lbl">DA</span></b><small>El Mordjene</small></div>
          </div>
          <button class="btn btn-wa" onclick="orderItem('Box Amis',1800)">💬 <span data-i18n="feat_order"></span></button>
        </div>
      </article>

      <article class="box-card reveal d1">
        <div class="box-head red">
          <h3 data-i18n="box_family"></h3>
          <span class="ppl">👨‍👩‍👧‍👦 <span data-i18n="box_family_ppl"></span></span>
        </div>
        <div class="box-body">
          <ul>
            <li data-i18n="box_c_fruits"></li>
            <li data-i18n="box_c_mini"></li>
            <li data-i18n="box_c_gaufres"></li>
            <li data-i18n="box_c_crepes"></li>
            <li data-i18n="box_c_marsh"></li>
            <li data-i18n="box_sauces"></li>
          </ul>
          <div class="box-prices">
            <div class="bp-chip n"><b>2200 <span class="da-lbl">DA</span></b><small>Nutella</small></div>
            <div class="bp-chip m"><b>1800 <span class="da-lbl">DA</span></b><small>El Mordjene</small></div>
          </div>
          <button class="btn btn-wa" onclick="orderItem('Box Famille',2200)">💬 <span data-i18n="feat_order"></span></button>
        </div>
      </article>

      <article class="box-card reveal d2">
        <div class="box-head">
          <h3 data-i18n="box_dubai"></h3>
          <span class="ppl">🍰 <span data-i18n="box_dubai_ppl"></span></span>
        </div>
        <div class="box-body">
          <ul>
            <li data-i18n="box_c_kunafa"></li>
            <li data-i18n="box_c_pistache"></li>
          </ul>
          <div class="box-prices">
            <div class="bp-chip n"><b>350 <span class="da-lbl">DA</span></b><small data-i18n="box_petite"></small></div>
            <div class="bp-chip m"><b>750 <span class="da-lbl">DA</span></b><small data-i18n="box_grande"></small></div>
          </div>
          <button class="btn btn-wa" onclick="orderItem('Cake Dubai (Grande Boîte)',750)">💬 <span data-i18n="feat_order"></span></button>
        </div>
      </article>

    </div>
  </div>
</section>

<footer id="footer"></footer>
